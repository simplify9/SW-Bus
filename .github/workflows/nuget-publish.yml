name: Build and Publish NuGet Package
run-name: publish-${{ github.ref_name }}-${{ github.run_number }}

on:
  push:
    branches: [main]
  workflow_dispatch:

# Ceiling for the reusable workflow's jobs: tag (contents: write), nuget
# (packages: write), critical-vuln gate (security-events: read).
permissions:
  contents: write
  packages: write
  security-events: read

jobs:
  Publish:
    uses: simplify9/.github/.github/workflows/reusable-nuget-publish.yml@main
    with:
      nuget-projects: >-
        SW.Bus/SW.Bus.csproj
        SW.Bus.RabbitMqExtensions/SW.Bus.RabbitMqExtensions.csproj
        SW.Bus.RabbitMqViewer/SW.Bus.RabbitMqViewer.csproj
      major-version: '8'
      minor-version: '1'
      dotnet-version: '8.0.x'
      run-tests: false
      test-projects: '**/*UnitTests/*.csproj'
    secrets:
      nuget-api-key: ${{ secrets.SWNUGETKEY }}
      dependabot-alerts-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
