name: Integration tests
run-name: integration-tests-${{ github.ref_name }}-${{ github.run_number }}

# The publish workflow runs no tests (run-tests: false), so nothing else exercises the bus against a
# real broker. These start RabbitMQ in Docker through Testcontainers, which GitHub's Ubuntu runners have.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test SW.Bus.IntegrationTests/SW.Bus.IntegrationTests.csproj --logger "console;verbosity=normal"
